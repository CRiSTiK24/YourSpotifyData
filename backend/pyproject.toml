[project]
name = "your-spotify-data-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139,<0.140",
    "uvicorn>=0.48,<0.49",
    "pydantic-settings>=2.14,<3",
    "pillow>=12,<13",
    "python-multipart>=0.0.20,<0.1",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.14,<0.15",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
